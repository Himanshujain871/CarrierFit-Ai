version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: careerfit-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - careerfit-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: careerfit-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - careerfit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerfit-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/careerfit
      - JWT_SECRET=${JWT_SECRET:-careerfit_super_secret_jwt_key_2026}
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service
    networks:
      - careerfit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerfit-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - careerfit-network

networks:
  careerfit-network:
    driver: bridge

volumes:
  mongodb_data:
